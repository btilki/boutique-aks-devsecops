# Mirror Online Boutique images, Trivy scan (CRITICAL gate), cosign sign by digest,
# optional SPDX SBOM + cosign attest (Topic 17 / ADR-0014).
# Requires ADO OIDC service connection and cosign key pair in Key Vault (Topic 09 setup).
stages:
  - stage: MirrorScanSign
    displayName: Mirror, scan, and sign
    dependsOn: Validate
    jobs:
      - job: boutique_supply_chain
        displayName: Boutique v0.10.5 supply chain
        pool:
          vmImage: ubuntu-22.04
        steps:
          - checkout: self
            fetchDepth: 1

          - task: AzureCLI@2
            displayName: Mirror, Trivy scan, cosign sign, SBOM attest
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                echo "=== Install Trivy $(trivyVersion) (checksum-verified release) ==="
                TRIVY_VER="$(trivyVersion)"
                TRIVY_ASSET="trivy_${TRIVY_VER}_Linux-64bit.tar.gz"
                TRIVY_DIR="$(Agent.TempDirectory)/trivy-install"
                mkdir -p "${TRIVY_DIR}"
                curl -fsSL -o "${TRIVY_DIR}/${TRIVY_ASSET}" \
                  "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VER}/${TRIVY_ASSET}"
                curl -fsSL -o "${TRIVY_DIR}/checksums.txt" \
                  "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VER}/trivy_${TRIVY_VER}_checksums.txt"
                awk -v asset="${TRIVY_ASSET}" '$2 == asset { print; found=1 } END { if (!found) exit 1 }' \
                  "${TRIVY_DIR}/checksums.txt" > "${TRIVY_DIR}/asset.sha256"
                (cd "${TRIVY_DIR}" && sha256sum -c asset.sha256)
                tar -xzf "${TRIVY_DIR}/${TRIVY_ASSET}" -C "${TRIVY_DIR}" trivy
                install -m 0755 "${TRIVY_DIR}/trivy" /usr/local/bin/trivy
                trivy --version

                echo "=== Install cosign $(cosignVersion) (checksum-verified release) ==="
                COSIGN_VER="$(cosignVersion)"
                COSIGN_ASSET="cosign-linux-amd64"
                COSIGN_DIR="$(Agent.TempDirectory)/cosign-install"
                mkdir -p "${COSIGN_DIR}"
                curl -fsSL -o "${COSIGN_DIR}/${COSIGN_ASSET}" \
                  "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VER}/${COSIGN_ASSET}"
                curl -fsSL -o "${COSIGN_DIR}/checksums.txt" \
                  "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VER}/cosign_checksums.txt"
                awk -v asset="${COSIGN_ASSET}" '$2 == asset { print; found=1 } END { if (!found) exit 1 }' \
                  "${COSIGN_DIR}/checksums.txt" > "${COSIGN_DIR}/asset.sha256"
                (cd "${COSIGN_DIR}" && sha256sum -c asset.sha256)
                install -m 0755 "${COSIGN_DIR}/${COSIGN_ASSET}" /usr/local/bin/cosign
                cosign version

                echo "=== Azure / ACR login ==="
                az acr login --name "$(acrName)"

                WORK_DIR="$(Agent.TempDirectory)/boutique-supply-chain"
                mkdir -p "${WORK_DIR}/sboms"
                DIGEST_MANIFEST="${WORK_DIR}/digest-manifest.json"
                echo "{}" > "${DIGEST_MANIFEST}"

                echo "=== Fetch cosign key from Key Vault ==="
                COSIGN_KEY="${WORK_DIR}/cosign.key"
                az keyvault secret show \
                  --vault-name "$(keyVaultName)" \
                  --name "$(cosignPrivateKeySecretName)" \
                  --query value -o tsv > "${COSIGN_KEY}"
                chmod 600 "${COSIGN_KEY}"
                # Pilot limit: passphrase is empty. The control is Key Vault RBAC on
                # cosign-private-key, not a passphrase. A client key would use a passphrase or keyless signing.
                export COSIGN_PASSWORD=""

                PUB_KEY="${WORK_DIR}/cosign.pub"
                az keyvault secret show \
                  --vault-name "$(keyVaultName)" \
                  --name "$(cosignPublicKeySecretName)" \
                  --query value -o tsv > "${PUB_KEY}"

                ENABLE_SBOM="$(enableSbomAttest)"
                ATTEST_TYPE="$(cosignAttestType)"

                for SERVICE in $(boutiqueServices); do
                  echo "========================================"
                  echo "Service: ${SERVICE}"
                  SRC_IMAGE="$(upstreamRegistry)/${SERVICE}:$(boutiqueVersion)"
                  DEST_REPO="$(acrLoginServer)/${SERVICE}"
                  DEST_VERSION_TAG="${DEST_REPO}:$(boutiqueVersion)"

                  echo "Pull ${SRC_IMAGE}"
                  docker pull "${SRC_IMAGE}"

                  echo "Tag and push ${DEST_VERSION_TAG}"
                  docker tag "${SRC_IMAGE}" "${DEST_VERSION_TAG}"
                  docker push "${DEST_VERSION_TAG}"

                  DIGEST="$(az acr repository show-manifests \
                    --name "$(acrName)" \
                    --repository "${SERVICE}" \
                    --query "[?contains(tags, '$(boutiqueVersion)')].digest | [0]" -o tsv)"
                  if [[ -z "${DIGEST}" || "${DIGEST}" == "null" ]]; then
                    echo "ERROR: Could not resolve digest for ${SERVICE}" >&2
                    exit 1
                  fi
                  DEST_DIGEST_REF="${DEST_REPO}@${DIGEST}"
                  echo "Digest: ${DEST_DIGEST_REF}"

                  # Pilot limit: CRITICAL only. --ignore-status fixed skips CVEs that already
                  # have an upstream fix. v0.10.5 is mirrored, not rebuilt, so those fixes are not in the image.
                  echo "Trivy scan (CRITICAL gate; ignore fixed upstream CVEs on pinned v0.10.5)"
                  trivy image --scanners vuln --severity CRITICAL --ignore-status fixed --exit-code 1 "${DEST_DIGEST_REF}"

                  echo "cosign sign"
                  cosign sign --key "${COSIGN_KEY}" --tlog-upload=false -y "${DEST_DIGEST_REF}"

                  echo "cosign verify (pipeline gate)"
                  cosign verify --key "${PUB_KEY}" --insecure-ignore-tlog "${DEST_DIGEST_REF}"

                  if [[ "${ENABLE_SBOM}" == "true" ]]; then
                    SBOM_FILE="${WORK_DIR}/sboms/${SERVICE}.spdx.json"
                    echo "Trivy SPDX SBOM → ${SBOM_FILE}"
                    trivy image --format spdx-json --output "${SBOM_FILE}" "${DEST_DIGEST_REF}"

                    echo "cosign attest --type ${ATTEST_TYPE}"
                    cosign attest --predicate "${SBOM_FILE}" --type "${ATTEST_TYPE}" \
                      --key "${COSIGN_KEY}" --tlog-upload=false -y "${DEST_DIGEST_REF}"

                    echo "cosign verify-attestation (pipeline gate)"
                    cosign verify-attestation --type "${ATTEST_TYPE}" \
                      --key "${PUB_KEY}" --insecure-ignore-tlog "${DEST_DIGEST_REF}" \
                      >/dev/null
                  else
                    echo "SBOM/attest skipped (enableSbomAttest=${ENABLE_SBOM})"
                  fi

                  jq --arg svc "${SERVICE}" --arg digest "${DIGEST}" \
                    '. + {($svc): $digest}' "${DIGEST_MANIFEST}" > "${DIGEST_MANIFEST}.tmp"
                  mv "${DIGEST_MANIFEST}.tmp" "${DIGEST_MANIFEST}"
                done

                echo "=== Digest manifest ==="
                cat "${DIGEST_MANIFEST}"

                cp "${DIGEST_MANIFEST}" "$(Build.ArtifactStagingDirectory)/digest-manifest.json"
                if [[ "${ENABLE_SBOM}" == "true" ]] && ls "${WORK_DIR}/sboms"/*.spdx.json >/dev/null 2>&1; then
                  mkdir -p "$(Build.ArtifactStagingDirectory)/sboms"
                  cp "${WORK_DIR}/sboms"/*.spdx.json "$(Build.ArtifactStagingDirectory)/sboms/"
                fi
            env:
              boutiqueServices: $(boutiqueServices)

          - task: PublishPipelineArtifact@1
            displayName: Publish digest manifest
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/digest-manifest.json
              artifact: digest-manifest
              publishLocation: pipeline

          - task: PublishPipelineArtifact@1
            displayName: Publish SPDX SBOM files
            condition: and(succeeded(), eq(variables['enableSbomAttest'], 'true'))
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/sboms
              artifact: sboms-spdx
              publishLocation: pipeline
